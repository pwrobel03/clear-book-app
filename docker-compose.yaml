# ─────────────────────────────────────────────────────────────────────────────
# ClearBook — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   Production (OCI):  docker compose up -d
#   Local dev:         docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up
#
# Required .env variables — see .env.example for full list:
#   DOMAIN, DB_USER, DB_PASSWORD, DB_NAME, JWT_SECRET,
#   EMAIL_USERNAME, EMAIL_2FA_PASSWORD, FRONTEND_URL
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres-db:
    image: postgres:18.3
    container_name: clearbook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clearbook-net

  # ── Backend (Spring Boot) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: clearbook-backend:latest
    container_name: clearbook_backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET:                   ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS:     ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_DAYS:  ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      EMAIL_USERNAME:               ${EMAIL_USERNAME}
      EMAIL_2FA_PASSWORD:           ${EMAIL_2FA_PASSWORD}
      FRONTEND_URL:                 ${FRONTEND_URL}
    volumes:
      # Persistent storage for doctor license PDFs and other uploaded files
      - uploads-data:/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - clearbook-net
    # NOTE: port 8080 is intentionally NOT exposed — the backend is only
    # reachable from within the Docker network (frontend → /api/backend/* rewrite).

  # ── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked into the Next.js build at image-build time.
        # The Next.js server proxies /api/backend/* → http://backend:8080/api/*
        SPRING_API_URL: http://backend:8080
    image: clearbook-frontend:latest
    container_name: clearbook_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - clearbook-net
    # NOTE: port 3000 is intentionally NOT exposed — all traffic enters via nginx.

  # ── Reverse Proxy (Nginx + TLS) ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: clearbook_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx/nginx.bootstrap.conf:/etc/nginx/nginx.bootstrap.conf:ro
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN}
    # envsubst '$$DOMAIN' substitutes only $DOMAIN, leaving nginx's own
    # $host, $remote_addr, etc. untouched in the final config.
    command: >-
      /bin/sh -c "
        envsubst '$$DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/conf.d/clearbook.conf &&
        nginx -g 'daemon off;'
      "
    depends_on:
      - frontend
    networks:
      - clearbook-net

  # ── Certificate management (run manually — see DEPLOY.md) ───────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: clearbook_certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    profiles:
      - certbot

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  clearbook-net:
    driver: bridge

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  uploads-data:
  certbot-certs:
  certbot-webroot:
