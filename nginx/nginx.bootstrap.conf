# ─────────────────────────────────────────────────────────────────────────────
# ClearBook — Nginx Bootstrap Configuration (HTTP only)
# ─────────────────────────────────────────────────────────────────────────────
# Used ONLY during the initial SSL certificate setup.
# After Certbot issues the certificate, switch to nginx.conf.template.
# See DEPLOY.md — Step 4: SSL Certificate.
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    upstream clearbook_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Certbot ACME challenge — must be accessible over HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Temporary: serve the app over HTTP while waiting for the certificate
        location / {
            proxy_pass        http://clearbook_frontend;
            proxy_set_header  Host              $host;
            proxy_set_header  X-Real-IP         $remote_addr;
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
        }
    }
}
