# ─────────────────────────────────────────────────────────────────────────────
# ClearBook — Nginx Bootstrap Configuration (HTTP only)
# ─────────────────────────────────────────────────────────────────────────────
# Mounted at /etc/nginx/conf.d/default.conf.
# The default nginx image already provides events{} and http{} in its
# /etc/nginx/nginx.conf — files in conf.d/ are included INSIDE http{},
# so DO NOT add events{} or http{} wrappers here.
# ─────────────────────────────────────────────────────────────────────────────

upstream clearbook_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Certbot ACME challenge — must be accessible over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve the app over HTTP while waiting for the certificate
    location / {
        proxy_pass        http://clearbook_frontend;
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;
    }
}
